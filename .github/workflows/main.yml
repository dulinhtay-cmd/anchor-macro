name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Sử dụng cố định bản Gradle 8.1 để không bị lỗi xung đột Fabric Loom
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.1'

    - name: Unzip mod.zip
      run: unzip mod.zip -d project_files

    - name: Find Build Directory and Build
      run: |
        BUILD_DIR=$(dirname $(find project_files -name "build.gradle" | head -n 1))
        echo "Found build directory at: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        # Ép buộc dùng lệnh gradle của hệ thống (bản 8.1 vừa cài)
        gradle build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Jar
        path: |
          project_files/**/build/libs/*.jar
