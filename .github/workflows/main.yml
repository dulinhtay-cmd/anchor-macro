name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip mod.zip
      run: unzip mod.zip -d project_files

    - name: Build with Gradle
      run: |
        cd project_files
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew build
        else
          gradle build
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Jar
        path: project_files/build/libs/*.jar
