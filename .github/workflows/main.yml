name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip mod.zip
      run: unzip mod.zip -d project_files

    - name: Find Build Directory and Build
      run: |
        # Tìm thư mục chứa file build.gradle
        BUILD_DIR=$(dirname $(find project_files -name "build.gradle" | head -n 1))
        echo "Found build directory at: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        # Tiến hành build
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew build
        else
          gradle build
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Jar
        path: |
          project_files/**/build/libs/*.jar
