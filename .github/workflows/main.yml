name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Nâng lên JDK 21 theo đúng yêu cầu của Minecraft 1.21.1
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.8'

    - name: Unzip mod.zip
      run: unzip mod.zip -d project_files

    - name: Find Build Directory and Build
      run: |
        BUILD_DIR=$(dirname $(find project_files -name "build.gradle" | head -n 1))
        echo "Found build directory at: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        gradle build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Jar
        path: |
          project_files/**/build/libs/*.jar
